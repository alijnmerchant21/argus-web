<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Argus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 390px;
        background: #f6f7fb;
        font-family:
          Inter,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: #111827;
      }
      button,
      input {
        font: inherit;
      }
      .shell {
        padding: 18px;
      }
      .hero {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .logo {
        width: 52px;
        height: 52px;
        border-radius: 14px;
        background: #000;
        object-fit: contain;
      }
      .title {
        min-width: 0;
        flex: 1;
      }
      h1 {
        font-size: 20px;
        line-height: 1.1;
        letter-spacing: 0;
      }
      h2 {
        font-size: 14px;
        line-height: 1.2;
        margin-top: 2px;
      }
      p {
        color: #667085;
      }
      .title p,
      .eyebrow {
        font-size: 11px;
        font-weight: 650;
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .switch {
        width: 52px;
        height: 30px;
        border: 0;
        border-radius: 999px;
        background: #d1d5db;
        padding: 3px;
        cursor: pointer;
        transition: 0.18s;
      }
      .switch span {
        display: block;
        width: 24px;
        height: 24px;
        border-radius: 999px;
        background: #fff;
        box-shadow: 0 2px 8px rgb(15 23 42 / 0.2);
        transition: 0.18s;
      }
      .switch.on {
        background: #111827;
      }
      .switch.on span {
        transform: translateX(22px);
      }
      .status {
        margin-top: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 12px;
        background: #fff;
      }
      .status strong {
        display: block;
        margin-top: 3px;
        font-size: 13px;
        color: #111827;
      }
      .status-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #f59e0b;
      }
      .status.connected {
        border-color: #bbf7d0;
        background: #f0fdf4;
      }
      .status.connected .status-dot {
        background: #22c55e;
      }
      .metrics {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-top: 12px;
      }
      .metrics div,
      .panel {
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        background: #fff;
      }
      .metrics div {
        padding: 12px;
      }
      .metrics strong {
        display: block;
        font-size: 22px;
        line-height: 1;
      }
      .metrics span {
        display: block;
        margin-top: 6px;
        color: #667085;
        font-size: 11px;
        font-weight: 600;
      }
      .panel {
        margin-top: 12px;
        padding: 14px;
      }
      .section-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .rule-list {
        display: grid;
        gap: 8px;
      }
      .rule-row {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        align-items: center;
        border: 1px solid #eef2f7;
        border-radius: 12px;
        padding: 9px;
      }
      .rule-row strong {
        display: block;
        font-size: 12px;
      }
      .rule-row p {
        margin-top: 2px;
        font-size: 11px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .action {
        color: var(--tone);
        background: color-mix(in srgb, var(--tone) 10%, white);
        border: 1px solid color-mix(in srgb, var(--tone) 24%, white);
        border-radius: 999px;
        padding: 5px 7px;
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
        text-align: center;
      }
      .guide {
        display: grid;
        gap: 8px;
      }
      .guide div {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        font-size: 12px;
      }
      .guide span {
        color: #667085;
        text-align: right;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
      }
      .primary,
      .secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border-radius: 13px;
        font-weight: 750;
        text-decoration: none;
        cursor: pointer;
      }
      .primary {
        border: 0;
        background: #111827;
        color: #fff;
      }
      .secondary {
        border: 1px solid #d8dee8;
        background: #fff;
        color: #344054;
      }
      .disconnect {
        width: 100%;
        margin-top: 10px;
        border: 0;
        background: transparent;
        color: #dc2626;
        font-size: 12px;
        font-weight: 650;
        cursor: pointer;
      }
      .config {
        display: grid;
        gap: 7px;
      }
      .config label {
        font-size: 11px;
        font-weight: 700;
        color: #667085;
      }
      .config input {
        width: 100%;
        border: 1px solid #d8dee8;
        border-radius: 11px;
        padding: 10px;
        font-size: 12px;
      }
      .empty {
        font-size: 12px;
        line-height: 1.45;
      }
    </style>
    <script type="module" crossorigin src="../../assets/index.html-gWE83yMY.js"></script>
    <link rel="modulepreload" crossorigin href="../../assets/storage-DOiXk9hX.js">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
